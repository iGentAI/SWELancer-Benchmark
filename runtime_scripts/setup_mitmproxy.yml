---
- hosts: localhost
  become: true
  gather_facts: yes
  tasks:
    - name: Create a symlink for this playbook in /app/tests if needed
      file:
        src: "{{ playbook_dir }}/{{ playbook_name }}"
        dest: "/app/tests/{{ playbook_name }}"
        state: link
        force: yes
      become: yes
      when: playbook_dir != "/app/tests"
      ignore_errors: yes
      vars:
        playbook_name: "{{ ansible_play_name | basename }}"

    - name: Create a new log directory for the ISSUE_ID
      file:
        path: "/app/tests/logs/{{ lookup('env', 'ISSUE_ID') }}"
        state: directory
        mode: '0755'

    - name: Check if mitmproxy is installed
      command: which mitmdump
      register: mitmdump_check
      ignore_errors: yes
      changed_when: false

    - name: Install mitmproxy if not already installed
      pip:
        name: mitmproxy
        executable: pip3.12
      when: mitmdump_check.rc != 0

    - name: Create mitmproxy directory if it doesn't exist
      file:
        path: "{{ lookup('env', 'HOME') }}/.mitmproxy"
        state: directory
        mode: '0700'
      become: no

    - name: Check if mitmproxy certificate exists
      stat:
        path: "{{ lookup('env', 'HOME') }}/.mitmproxy/mitmproxy-ca-cert.pem"
      register: mitmproxy_cert
      failed_when: not mitmproxy_cert.stat.exists
    
    - name: Create directory for mitmproxy certificates (Debian/Ubuntu)
      file:
        path: /usr/local/share/ca-certificates/extra
        state: directory
        mode: '0755'
      when: ansible_os_family == "Debian"

    - name: Create directory for mitmproxy certificates (Fedora/Amazon Linux)
      file:
        path: /etc/pki/ca-trust/source/anchors
        state: directory
        mode: '0755'
      when: ansible_os_family == "RedHat"
    
    - name: Install mitmproxy certificates to system's trusted certificates (Debian/Ubuntu)
      shell: |
        cp mitmproxy-ca-cert.pem /usr/local/share/ca-certificates/extra/mitmproxy-ca-cert.crt
        update-ca-certificates
      args:
        chdir: "{{ lookup('env', 'HOME') }}/.mitmproxy/"
      become: yes
      when: ansible_os_family == "Debian"

    - name: Install mitmproxy certificates to system's trusted certificates (Fedora/Amazon Linux)
      shell: |
        cp mitmproxy-ca-cert.pem /etc/pki/ca-trust/source/anchors/mitmproxy-ca-cert.crt
        update-ca-trust extract
      args:
        chdir: "{{ lookup('env', 'HOME') }}/.mitmproxy/"
      become: yes
      when: ansible_os_family == "RedHat"

    - name: Ensure libnss3-tools is installed (Debian/Ubuntu)
      apt:
        name: libnss3-tools
        state: present
      when: ansible_os_family == "Debian"

    - name: Ensure nss-tools is installed (Fedora/Amazon Linux)
      dnf:
        name: nss-tools
        state: present
      when: ansible_os_family == "RedHat"

    - name: Install mitmproxy generated certificates to browser's trusted certificates
      shell: |
        certfile="{{ lookup('env', 'HOME') }}/.mitmproxy/mitmproxy-ca-cert.pem"
        certname="mitmproxy-ca-cert"

        certutil --empty-password -d sql:{{ lookup('env', 'HOME') }}/.pki/nssdb -A -t "C,," -n $certname -i $certfile
      args:
        chdir: "{{ lookup('env', 'HOME') }}/.mitmproxy/"
      become: no